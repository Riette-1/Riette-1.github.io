<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.88" r="0.62">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ede4ff"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ede4ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(51.2 51.2) scale(0.8)">
  <!-- the alcove, lit from below by a reading lamp -->
  <path d="M124 410V236a132 132 0 0 1 264 0v174z" fill="#ffffff" fill-opacity="0.16"/>
  <path d="M124 410V236a132 132 0 0 1 264 0v174z" fill="url(#lamp)"/>
  <!-- night sky: crescent moon and two stars -->
  <path d="M300 140a60 60 0 1 0 48 98 49 49 0 1 1-48-98z" fill="#fde68a"/>
  <circle cx="200" cy="176" r="8" fill="#fde68a" fill-opacity="0.9"/>
  <circle cx="226" cy="222" r="5" fill="#fde68a" fill-opacity="0.75"/>
  <!-- page edges under the open book -->
  <path d="M256 330c-36-22-84-28-130-21v100c46-7 94-1 130 21 36-22 84-28 130-21V309c-46-7-94-1-130 21z" fill="#c4b5fd"/>
  <!-- open book -->
  <path d="M256 316c-36-22-84-28-130-21v100c46-7 94-1 130 21z" fill="url(#pageL)"/>
  <path d="M256 316c36-22 84-28 130-21v100c-46-7-94-1-130 21z" fill="url(#pageR)"/>
  <!-- bookmark ribbon -->
  <path d="M243 320v62l13-11 13 11v-62z" fill="#db2777"/>
  </g>
</svg>
